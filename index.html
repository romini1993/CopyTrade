<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Trading Log - Porto Style</title>
    
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        html, body { width: 100%; min-height: 100vh; margin: 0; padding: 0; background: #090a10; color: #e2e8f0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        * { box-sizing: border-box; }
        input, select, textarea, button { font-size: 15px !important; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .num { font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #23273c; border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #6366f1; }

        .porto-card { background: #10121d; border: 1px solid #1e2235; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
        .porto-input { background: #090a10; border: 1px solid #23273c; color: #f1f5f9; }
        .porto-input:focus { border-color: #6366f1; outline: none; }
        
        .flatpickr-calendar { background: #10121d !important; box-shadow: 0 10px 30px rgba(0,0,0,.6) !important; border: 1px solid #23273c !important; }
        .flatpickr-day.selected { background: #6366f1 !important; border-color: #6366f1 !important; color: #ffffff !important; }
        .flatpickr-day.today { border-color: #6366f1 !important; }

        @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .rise-in { animation: riseIn .3s ease-out both; }

        /* Toast Notification Styling (Tengah-Atas Layar) */
        #toast {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
            opacity: 0;
            z-index: 9999;
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body class="p-3 md:p-6 flex justify-center pb-20">
    <div class="w-full max-w-[1600px] grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
        
        <!-- KOLOM 1 (KIRI): Header, Stats, Form Input Awal -->
        <div class="lg:col-span-4 xl:col-span-4 space-y-5 lg:sticky lg:top-6">
            <!-- Header Dikecilin (Compact Style) -->
            <div class="porto-card px-4 py-3 rounded-xl flex items-center justify-between border-l-4 border-l-indigo-500">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-display text-base font-bold">
                        ⚡
                    </div>
                    <div>
                        <h1 class="font-display text-base font-bold tracking-tight text-white leading-none">TRADING LOG</h1>
                        <p class="text-[10px] text-slate-400 mt-0.5">Jurnal Presisi & Rekap Otomatis</p>
                    </div>
                </div>
            </div>

            <!-- Stats Bar -->
            <div id="statsBar" class="grid grid-cols-3 gap-2.5">
                <div class="porto-card p-3 rounded-xl text-center flex flex-col justify-center">
                    <div class="text-[10px] uppercase font-semibold tracking-wider text-slate-400 mb-0.5">Total PNL</div>
                    <div id="statTotal" class="num text-sm font-bold text-slate-200">–</div>
                    <div id="statTotalIdr" class="text-[10px] text-slate-400 font-medium num mt-0.5">–</div>
                </div>
                <div class="porto-card p-3 rounded-xl text-center flex flex-col justify-center">
                    <div class="text-[10px] uppercase font-semibold tracking-wider text-slate-400 mb-0.5">Trades</div>
                    <div id="statCount" class="num text-sm font-bold text-slate-200">–</div>
                </div>
                <div class="porto-card p-3 rounded-xl text-center flex flex-col justify-center">
                    <div class="text-[10px] uppercase font-semibold tracking-wider text-slate-400 mb-0.5">Win Rate</div>
                    <div id="statWinRate" class="num text-sm font-bold text-slate-200">–</div>
                </div>
            </div>

            <!-- Form Input Trade Langsung -->
            <form id="tradeForm" onsubmit="handleSubmit(event)" class="porto-card p-5 rounded-2xl space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-indigo-400">Input Position</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Pair / Koin</label>
                    <input type="text" id="pair" list="pairList" required placeholder="Contoh: BTCUSDT" onblur="formatPairInput(this)" class="w-full porto-input rounded-xl px-3.5 py-2.5 uppercase font-medium">
                    <datalist id="pairList">
                        <option value="ADAUSDT"><option value="ALGOUSDT"><option value="APTUSDT"><option value="ARBUSDT"><option value="ATOMUSDT"><option value="AVAXUSDT"><option value="BCHUSDT"><option value="BNBUSDT"><option value="BTCUSDT"><option value="CLUSDT"><option value="DOGEUSDT"><option value="DOTUSDT"><option value="ETHUSDT"><option value="FTMUSDT"><option value="INJUSDT"><option value="KORUUSDT"><option value="LINKUSDT"><option value="TCUSDT"><option value="LSKUSDT"><option value="LTCUSDT"><option value="NEARUSDT"><option value="OPUSDT"><option value="PEPEUSDT"><option value="SEIUSDT"><option value="SHIBUSDT"><option value="SKHYNIXUSDT"><option value="SKHYUSDT"><option value="SNDKUSDT"><option value="SOLUSDT"><option value="SOPHUSDT"><option value="SUIUSDT"><option value="TIAUSDT"><option value="TONUSDT"><option value="TRXUSDT"><option value="WIFUSDT"><option value="XRPUSDT"><option value="ZECUSDT">
                    </datalist>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">Opened Date</label>
                        <input type="text" id="opened" required placeholder="dd/mm/yyyy" class="w-full porto-input rounded-xl px-3.5 py-2.5">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">Closed Date</label>
                        <input type="text" id="closed" required placeholder="dd/mm/yyyy" class="w-full porto-input rounded-xl px-3.5 py-2.5">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Closing PNL (USDT)</label>
                    <input type="number" step="any" id="pnl" required placeholder="0.00 (minus pakai -)" class="w-full porto-input rounded-xl px-3.5 py-2.5 num font-medium">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/20">
                    Simpan Position
                </button>
            </form>
        </div>

        <!-- KOLOM 2 (TENGAH): Rekap Harian -->
        <div class="lg:col-span-4 xl:col-span-4 space-y-4 lg:sticky lg:top-6">
            <div class="porto-card p-4 sm:p-5 rounded-2xl space-y-3">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-indigo-400">Rekap Harian</h2>
                    <span class="text-[10px] text-slate-400">Klik tanggal untuk filter</span>
                </div>
                <div id="rekapHarianContainer" class="space-y-2.5 max-h-[calc(100vh-140px)] overflow-y-auto pr-1 custom-scroll">
                    <div class="text-center text-xs text-slate-500 py-6">Memuat rekap...</div>
                </div>
            </div>
        </div>

        <!-- KOLOM 3 (KANAN): Riwayat Trade -->
        <div class="lg:col-span-4 xl:col-span-4 space-y-4 lg:sticky lg:top-6">
            <div class="porto-card p-4 sm:p-5 rounded-2xl space-y-3">
                <div class="flex justify-between items-center mb-1">
                    <h2 id="listHeaderTitle" class="text-xs font-bold uppercase tracking-wider text-indigo-400">Riwayat Trade</h2>
                    <button id="resetFilterBtn" onclick="filterByDate(null)" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded hidden border border-slate-700">
                        🔄 Semua Tanggal
                    </button>
                </div>
                <div id="riwayatContainer" class="space-y-2.5 max-h-[calc(100vh-140px)] overflow-y-auto pr-1 custom-scroll">
                    <div class="text-center text-xs text-slate-500 py-6">Memuat riwayat...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL KONFIRMASI HAPUS TRADE -->
    <div id="deleteModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="porto-card w-full max-w-sm p-6 rounded-2xl border border-indigo-500/30 shadow-2xl space-y-4 rise-in text-center relative">
            <div class="w-12 h-12 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 flex items-center justify-center text-xl font-bold mx-auto">
                ⚠️
            </div>
            <div>
                <h3 class="font-display font-bold text-white text-base mb-1">Hapus Trade</h3>
                <p id="deleteModalText" class="text-xs text-slate-400">Yakin mau hapus posisi trade ini?</p>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeDeleteModal()" class="w-1/2 bg-[#1e2235] hover:bg-[#282d47] text-slate-300 font-semibold py-2.5 rounded-xl text-xs transition">
                    Batal (Esc)
                </button>
                <button type="button" id="confirmDeleteBtn" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/20 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                    Ya, Hapus (Enter)
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION FLOATING -->
    <div id="toast" class="px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl backdrop-blur-md border flex items-center gap-2">
        <span id="toastIcon"></span>
        <span id="toastText"></span>
    </div>

    <script>
        // URL Web App Google Apps Script CopyTrade yang benar dan aktif
        const API_URL = "https://script.google.com/macros/s/AKfycbycI7_uPzXvB5S5Q85M6I9x91Q8X7105S7lJ8251L9N5L6F7P81Q/exec"; 
        const LOCAL_STORAGE_KEY = "copytrade_cached_data";

        let globalData = [];
        let selectedFilterDate = null;
        let deleteTargetNo = null;
        let toastTimeout = null;

        flatpickr("#opened", { dateFormat: "d/m/Y", defaultDate: "today" });
        flatpickr("#closed", { dateFormat: "d/m/Y", defaultDate: "today" });

        window.onload = function() {
            const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (cached) {
                try {
                    globalData = JSON.parse(cached);
                    renderApp();
                } catch(e) {}
            }
            loadData();
        };

        // Otomatis Tambah USDT di Pair
        function formatPairInput(input) {
            let val = input.value.trim().toUpperCase();
            if (val && !val.includes("USDT")) {
                input.value = val + "USDT";
            } else {
                input.value = val;
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const text = document.getElementById('toastText');

            if (toastTimeout) clearTimeout(toastTimeout);
            text.innerText = message;

            if (type === 'success') {
                icon.innerText = '✓';
                toast.className = "px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl backdrop-blur-md border flex items-center gap-2 bg-emerald-500/20 border-emerald-500/40 text-emerald-300 show";
            } else {
                icon.innerText = '✕';
                toast.className = "px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl backdrop-blur-md border flex items-center gap-2 bg-rose-500/20 border-rose-500/40 text-rose-300 show";
            }

            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }

        function loadData() {
            fetch(API_URL + "?action=read")
                .then(res => res.json())
                .then(data => {
                    globalData = data;
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
                    renderApp();
                })
                .catch(err => console.error("Gagal sinkron data", err));
        }

        function filterByDate(dateStr) {
            selectedFilterDate = dateStr;
            renderApp();
        }

        function formatIdr(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
        }

        function parseDateKey(dStr) {
            if (!dStr) return '';
            if (dStr.includes('T')) {
                const d = new Date(dStr);
                if (!isNaN(d.getTime())) {
                    const day = String(d.getDate()).padStart(2, '0');
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const year = d.getFullYear();
                    return `${day}/${month}/${year}`;
                }
            }
            return dStr.split('T')[0].trim();
        }

        function renderApp() {
            const riwayatEl = document.getElementById('riwayatContainer');
            const rekapEl = document.getElementById('rekapHarianContainer');
            const headerTitle = document.getElementById('listHeaderTitle');
            const resetBtn = document.getElementById('resetFilterBtn');

            riwayatEl.innerHTML = '';
            rekapEl.innerHTML = '';

            let totalPnlUsdt = 0;
            let totalPnlIdr = 0;
            let totalTrades = globalData.length;
            let winTrades = 0;

            let rekapMap = {};

            globalData.forEach(item => {
                const pnl = parseFloat(item.pnl || 0);
                const pnlIdr = parseFloat(item.pnlIdr || 0);
                totalPnlUsdt += pnl;
                totalPnlIdr += pnlIdr;
                if (pnl > 0) winTrades++;

                const cDate = parseDateKey(item.closed);
                if (!rekapMap[cDate]) {
                    rekapMap[cDate] = { count: 0, pnlUsdt: 0, pnlIdr: 0 };
                }
                rekapMap[cDate].count += 1;
                rekapMap[cDate].pnlUsdt += pnl;
                rekapMap[cDate].pnlIdr += pnlIdr;
            });

            // Update Stats Bar
            document.getElementById('statTotal').innerText = (totalPnlUsdt >= 0 ? '+' : '') + totalPnlUsdt.toFixed(2);
            document.getElementById('statTotal').className = `num text-sm font-bold ${totalPnlUsdt >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
            document.getElementById('statTotalIdr').innerText = formatIdr(totalPnlIdr);
            document.getElementById('statCount').innerText = totalTrades;
            document.getElementById('statWinRate').innerText = totalTrades > 0 ? Math.round((winTrades / totalTrades) * 100) + '%' : '0%';

            // Render Rekap Harian
            const sortedDates = Object.keys(rekapMap).sort((a,b) => {
                const [dA, mA, yA] = a.split('/');
                const [dB, mB, yB] = b.split('/');
                return new Date(yB, mB-1, dB) - new Date(yA, mA-1, dA);
            });

            if (sortedDates.length === 0 || (sortedDates.length === 1 && sortedDates[0] === '')) {
                rekapEl.innerHTML = `<div class="text-center text-xs text-slate-500 py-6">Belum ada rekap.</div>`;
            } else {
                sortedDates.forEach(date => {
                    if (!date) return;
                    const r = rekapMap[date];
                    const isSelected = selectedFilterDate === date;
                    const isPlus = r.pnlUsdt >= 0;

                    const card = document.createElement('div');
                    card.className = `p-3.5 rounded-xl border cursor-pointer transition flex justify-between items-center ${
                        isSelected 
                        ? 'bg-indigo-500/10 border-indigo-500 text-white font-bold ring-1 ring-indigo-500' 
                        : 'bg-[#090a10] border-[#23273c] hover:border-slate-600 text-slate-200'
                    }`;
                    card.onclick = () => filterByDate(isSelected ? null : date);
                    card.innerHTML = `
                        <div>
                            <div class="text-xs font-semibold text-white">${date}</div>
                            <div class="text-[10px] text-slate-400 mt-0.5">${r.count} trade tertutup</div>
                        </div>
                        <div class="text-right">
                            <div class="num font-bold text-xs ${isPlus ? 'text-emerald-400' : 'text-rose-400'}">${isPlus ? '+' : ''}${r.pnlUsdt.toFixed(2)} USDT</div>
                            <div class="num text-[10px] text-slate-400">${formatIdr(r.pnlIdr)}</div>
                        </div>
                    `;
                    rekapEl.appendChild(card);
                });
            }

            // Filter Riwayat
            let filteredData = globalData;
            if (selectedFilterDate) {
                filteredData = globalData.filter(item => parseDateKey(item.closed) === selectedFilterDate);
                headerTitle.innerText = `Trade: ${selectedFilterDate}`;
                resetBtn.classList.remove('hidden');
            } else {
                headerTitle.innerText = "Riwayat Trade";
                resetBtn.classList.add('hidden');
            }

            if (filteredData.length === 0) {
                riwayatEl.innerHTML = `<div class="text-center text-xs text-slate-500 py-6">Tidak ada trade pada tanggal ini.</div>`;
                return;
            }

            const reversedData = filteredData.slice().reverse();

            reversedData.forEach((item, index) => {
                const pnl = parseFloat(item.pnl || 0);
                const pnlIdr = parseFloat(item.pnlIdr || 0);
                const isWin = pnl >= 0;
                const noDisplay = reversedData.length - index;

                const card = document.createElement('div');
                card.className = "p-3.5 bg-[#090a10] border border-[#23273c] rounded-xl flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <div class="text-xs text-slate-400">#${noDisplay} • ${parseDateKey(item.closed)}</div>
                        <div class="text-sm font-semibold text-white mt-0.5">${item.pair}</div>
                        <div class="text-[10px] font-semibold tracking-wider uppercase mt-0.5 ${isWin ? 'text-emerald-400' : 'text-rose-400'}">${isWin ? 'PROFIT' : 'LOSS'}</div>
                    </div>
                    <div class="text-right">
                        <div class="num font-bold text-xs ${isWin ? 'text-emerald-400' : 'text-rose-400'}">${isWin ? '+' : ''}${pnl.toFixed(2)} USDT</div>
                        <div class="num text-[10px] text-slate-400">${formatIdr(pnlIdr)}</div>
                        <button onclick="openDeleteModal(${item.no})" class="text-[10px] bg-rose-600/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded mt-1.5 hover:bg-rose-600/40">Hapus</button>
                    </div>
                `;
                riwayatEl.appendChild(card);
            });
        }

        // OPTIMISTIC UPDATE: SIMPAN TANPA TUNGGU LOADING
        function handleSubmit(e) {
            e.preventDefault();
            const pairField = document.getElementById('pair');
            formatPairInput(pairField); // Pastikan USDT nempel sebelum diambil
            
            const pair = pairField.value.toUpperCase().trim();
            const opened = document.getElementById('opened').value;
            const closed = document.getElementById('closed').value;
            const pnl = parseFloat(document.getElementById('pnl').value || 0);
            
            const pnlIdr = pnl * 17600; 

            const newItem = {
                no: globalData.length + 1,
                pair: pair,
                opened: opened,
                closed: closed,
                pnl: pnl,
                pnlIdr: pnlIdr
            };

            globalData.push(newItem);
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(globalData));
            renderApp();

            showToast("Tersimpan", "success");

            document.getElementById('pair').value = '';
            document.getElementById('pnl').value = '';

            const encPair = encodeURIComponent(pair);
            const encOp = encodeURIComponent(opened);
            const encCl = encodeURIComponent(closed);
            const encPnl = encodeURIComponent(pnl);

            fetch(`${API_URL}?action=add&pair=${encPair}&opened=${encOp}&closed=${encCl}&pnl=${encPnl}`)
                .then(() => loadData());
        }

        function openDeleteModal(no) {
            deleteTargetNo = no;
            document.getElementById('deleteModal').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('confirmDeleteBtn').focus();
            }, 50);
        }

        function closeDeleteModal() {
            deleteTargetNo = null;
            document.getElementById('deleteModal').classList.add('hidden');
        }

        window.addEventListener('keydown', function(e) {
            const modal = document.getElementById('deleteModal');
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('confirmDeleteBtn').click();
                } else if (e.key === 'Escape') {
                    closeDeleteModal();
                }
            }
        });

        // OPTIMISTIC UPDATE: HAPUS TANPA TUNGGU LOADING
        document.getElementById('confirmDeleteBtn').onclick = function() {
            if (deleteTargetNo !== null) {
                const targetNo = deleteTargetNo;
                closeDeleteModal();

                globalData = globalData.filter(item => item.no !== targetNo);
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(globalData));
                renderApp();

                showToast("Terhapus", "error");

                fetch(`${API_URL}?action=delete&no=${targetNo}`)
                    .then(() => loadData());
            }
        };
    </script>
</body>
</html>
