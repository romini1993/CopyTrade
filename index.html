<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Trading Log</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        html, body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: #080b13;
            color: #eef2f7;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        * { box-sizing: border-box; }
        input, select, textarea, button { font-size: 16px !important; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .num { font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }

        .flatpickr-calendar { background: #131a29 !important; box-shadow: 0 10px 30px rgba(0,0,0,.5) !important; border: 1px solid #232d42 !important; }
        .flatpickr-day.selected { background: #22d3ee !important; border-color: #22d3ee !important; color: #061018 !important; }
        .flatpickr-day.today { border-color: #22d3ee !important; }
        .flatpickr-current-month .flatpickr-monthDropdown-months, .numInputWrapper span { color: #eef2f7; }
        span.flatpickr-weekday { color: #7d8aa3 !important; }

        @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .rise-in { animation: riseIn .35s ease-out both; }
    </style>
</head>
<body class="px-4 pt-6 pb-14 flex flex-col items-center">

    <div class="w-full max-w-md space-y-5">

        <!-- Header -->
        <header class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-lg bg-cyan-400/10 border border-cyan-400/30 flex items-center justify-center text-cyan-300 font-display font-bold">⚡</div>
            <div>
                <h1 class="font-display text-lg font-semibold text-white leading-tight">Fast Trading Log</h1>
                <p class="text-xs text-slate-500">Input cepat, rekap otomatis</p>
            </div>
        </header>

        <!-- Stats bar -->
        <div id="statsBar" class="grid grid-cols-3 gap-2">
            <div class="bg-[#131a29] border border-[#232d42] rounded-xl px-3 py-2.5 text-center">
                <div class="text-[10px] text-slate-500 mb-0.5">Total PNL</div>
                <div id="statTotal" class="num text-sm font-semibold text-slate-300">–</div>
            </div>
            <div class="bg-[#131a29] border border-[#232d42] rounded-xl px-3 py-2.5 text-center">
                <div class="text-[10px] text-slate-500 mb-0.5">Trades</div>
                <div id="statCount" class="num text-sm font-semibold text-slate-300">–</div>
            </div>
            <div class="bg-[#131a29] border border-[#232d42] rounded-xl px-3 py-2.5 text-center">
                <div class="text-[10px] text-slate-500 mb-0.5">Win Rate</div>
                <div id="statWinRate" class="num text-sm font-semibold text-slate-300">–</div>
            </div>
        </div>

        <!-- Form Input -->
        <form id="tradeForm" onsubmit="handleSubmit(event)" class="bg-[#131a29] p-4 rounded-2xl shadow-xl space-y-3 border border-[#232d42]">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Pair / Koin</label>
                <input type="text" id="pair" list="pairList" required placeholder="Contoh: ZECUSDT" class="w-full bg-[#0d1220] border border-[#232d42] rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-cyan-400/60 uppercase">
                <datalist id="pairList">
                    <option value="ZECUSDT">
                    <option value="ETHUSDT">
                    <option value="BTCUSDT">
                    <option value="SKHYNIXUSDT">
                    <option value="SNDKUSDT">
                </datalist>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Opened Date</label>
                    <input type="text" id="opened" required placeholder="dd/mm/yyyy" class="w-full bg-[#0d1220] border border-[#232d42] rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-cyan-400/60">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Closed Date</label>
                    <input type="text" id="closed" required placeholder="dd/mm/yyyy" class="w-full bg-[#0d1220] border border-[#232d42] rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-cyan-400/60">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Closing PNL (USDT)</label>
                <input type="number" step="any" id="pnl" required placeholder="0.00 (minus pakai -)" class="w-full bg-[#0d1220] border border-[#232d42] rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-cyan-400/60 num">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-cyan-400 hover:bg-cyan-300 active:scale-[0.99] font-semibold py-3 rounded-xl transition shadow-lg shadow-cyan-400/10 text-slate-950">
                Simpan Trade
            </button>
        </form>

        <!-- Rekap Harian Section -->
        <div>
            <h2 class="text-xs font-semibold text-slate-400 mb-2">Rekap Harian</h2>
            <div id="dailySummaryList" class="space-y-2"></div>
        </div>

        <!-- Recent Trades List -->
        <div>
            <h2 class="text-xs font-semibold text-slate-400 mb-2">Seluruh Riwayat Trade</h2>
            <div id="loading" class="text-center text-xs text-slate-500 py-4">Memuat data...</div>
            <div id="tradeList" class="space-y-2"></div>
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwWJF1sD1SSUjPCCeCWIFgMOI0LI_58HpzzCPVoTDXDgIMG2jFAfcLOu8WNE1D1zYzl/exec"; 
        let currentKursIdr = 17550;

        function fetchRealtimeKurs() {
            fetch("https://api.binance.com/api/v3/ticker/price?symbol=USDTIDR")
                .then(res => res.json())
                .then(data => {
                    if (data && data.price) {
                        currentKursIdr = parseFloat(data.price);
                    }
                })
                .catch(err => console.log("Pakai kurs fallback:", currentKursIdr));
        }

        const getTodayStr = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        const todayStr = getTodayStr();

        const closedPicker = flatpickr("#closed", {
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "d/m/Y",
            defaultDate: "today",
            disableMobile: true
        });

        const openedPicker = flatpickr("#opened", {
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "d/m/Y",
            defaultDate: "today",
            disableMobile: true,
            onChange: function(selectedDates, dateStr) {
                if (!dateStr) return;
                closedPicker.set("minDate", dateStr);
                if (dateStr > todayStr) {
                    closedPicker.setDate(dateStr, true);
                } else {
                    closedPicker.setDate(todayStr, true);
                }
            }
        });

        window.onload = function() {
            fetchRealtimeKurs();
            
            // 1. Tampilkan data dari memori lokal (KURS CEPAT)
            const cachedData = localStorage.getItem('tradingDataCache');
            if (cachedData) {
                try {
                    renderDashboard(JSON.parse(cachedData));
                } catch(e) {}
            }
            
            // 2. Tarik data terbaru di background
            loadData();
        };

        function loadData() {
            if (!localStorage.getItem('tradingDataCache')) {
                document.getElementById('loading').style.display = 'block';
            }
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    // Simpan ke memori lokal
                    localStorage.setItem('tradingDataCache', JSON.stringify(data));
                    renderDashboard(data);
                })
                .catch(err => handleError(err));
        }

        function getDayName(dateStr) {
            if (!dateStr) return '';
            var parts = dateStr.split('/');
            if (parts.length === 3) {
                var d = new Date(parts[2], parts[1] - 1, parts[0]);
                var days = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
                return days[d.getDay()] || '';
            }
            return '';
        }

        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(amount);
        }

        function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Menyimpan...";

            const pair = encodeURIComponent(document.getElementById('pair').value);
            const opened = encodeURIComponent(document.getElementById('opened').value);
            const closed = encodeURIComponent(document.getElementById('closed').value);
            const pnl = encodeURIComponent(document.getElementById('pnl').value);

            const sendUrl = `${API_URL}?action=add&pair=${pair}&opened=${opened}&closed=${closed}&pnl=${pnl}`;

            fetch(sendUrl, { mode: 'no-cors' })
                .then(() => {
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerText = "Simpan Trade";
                        document.getElementById('pnl').value = '';
                        loadData();
                    }, 1500);
                })
                .catch(err => {
                    alert("Gagal menyimpan data.");
                    btn.disabled = false;
                    btn.innerText = "Simpan Trade";
                });
        }

        function handleHapus(no) {
            if (confirm("Yakin mau hapus trade No #" + no + "?")) {
                const deleteUrl = `${API_URL}?action=delete&no=${no}`;
                fetch(deleteUrl, { mode: 'no-cors' })
                    .then(() => {
                        setTimeout(() => loadData(), 1500);
                    })
                    .catch(err => alert("Gagal menghapus."));
            }
        }

        function renderDashboard(res) {
            document.getElementById('loading').style.display = 'none';

            const tradeContainer = document.getElementById('tradeList');
            const dailyContainer = document.getElementById('dailySummaryList');

            tradeContainer.innerHTML = '';
            dailyContainer.innerHTML = '';

            const data = res.history || [];

            renderStats(res);

            if (!data || data.length === 0) {
                tradeContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Belum ada data trading.</p>';
                dailyContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Belum ada rekap.</p>';
                return;
            }

            data.forEach((item, i) => {
                const pnlNum = parseFloat(item.pnl) || 0;
                const isProfit = pnlNum >= 0;
                const pnlColor = isProfit ? 'text-emerald-400' : 'text-rose-400';
                const bgCard = isProfit ? 'border-emerald-900/40 bg-emerald-950/10' : 'border-rose-900/40 bg-rose-950/10';

                const div = document.createElement('div');
                div.className = `rise-in p-3 rounded-xl border ${bgCard} flex justify-between items-center`;
                div.style.animationDelay = `${i * 15}ms`;
                div.innerHTML = `
                    <div class="w-1/3 text-left">
                        <div class="text-xs text-slate-400 font-medium">${item.closed}</div>
                    </div>
                    <div class="w-1/3 text-center">
                        <div class="font-display font-semibold text-sm text-white">${item.pair}</div>
                    </div>
                    <div class="w-1/3 flex items-center justify-end gap-2 text-right">
                        <div class="num font-semibold text-sm ${pnlColor}">${isProfit ? '+' : ''}${pnlNum.toFixed(2)}</div>
                        <button onclick="handleHapus(${item.no})" class="bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded text-[11px] font-semibold transition">
                            ✕
                        </button>
                    </div>
                `;
                tradeContainer.appendChild(div);
            });

            const dailyMap = {};
            data.forEach(item => {
                const closedDate = item.closed;
                const pnlVal = parseFloat(item.pnl) || 0;
                if (!closedDate) return;

                if (!dailyMap[closedDate]) {
                    dailyMap[closedDate] = { total: 0, count: 0 };
                }
                dailyMap[closedDate].total += pnlVal;
                dailyMap[closedDate].count += 1;
            });

            Object.keys(dailyMap).forEach((date, i) => {
                const summary = dailyMap[date];
                const isProf = summary.total >= 0;
                const color = isProf ? 'text-emerald-400' : 'text-rose-400';
                const bg = isProf ? 'border-emerald-900/40 bg-emerald-950/15' : 'border-rose-900/40 bg-rose-950/15';
                
                var dayName = getDayName(date);
                var fullDateLabel = dayName ? `${dayName}, ${date}` : date;
                var totalIdr = formatRupiah(summary.total * currentKursIdr);

                const div = document.createElement('div');
                div.className = `rise-in p-3 rounded-xl border ${bg} flex items-center justify-between`;
                div.style.animationDelay = `${i * 25}ms`;
                div.innerHTML = `
                    <div>
                        <div class="font-display font-semibold text-sm text-white">${fullDateLabel}</div>
                        <div class="text-[11px] text-slate-500">${summary.count} trade tertutup</div>
                    </div>
                    <div class="text-right">
                        <div class="num font-semibold text-sm ${color}">
                            ${isProf ? '+' : ''}${summary.total.toFixed(2)} USDT
                        </div>
                        <div class="text-[10px] text-slate-400 font-medium num mt-0.5">
                            ${totalIdr}
                        </div>
                    </div>
                `;
                dailyContainer.appendChild(div);
            });
        }

        function renderStats(res) {
            const totalEl = document.getElementById('statTotal');
            const countEl = document.getElementById('statCount');
            const winEl = document.getElementById('statWinRate');

            const total = parseFloat(res.totalPnl) || 0;
            const isProfit = total >= 0;

            totalEl.textContent = `${isProfit ? '+' : ''}${total.toFixed(2)}`;
            totalEl.className = `num text-sm font-semibold ${isProfit ? 'text-emerald-400' : 'text-rose-400'}`;
            countEl.textContent = res.totalTrades || 0;
            winEl.textContent = `${res.winRate || 0}%`;
        }

        function handleError(err) {
            if (!localStorage.getItem('tradingDataCache')) {
                document.getElementById('loading').innerText = "Gagal memuat data.";
            }
            console.error(err);
        }
    </script>
</body>
</html>
